version: '3.8'

services:
  flask-monitor:
    build: .
    container_name: monitor_container
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # Map a directory instead of a single file for better permission handling
      - ./data:/app/data
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1

# Use default bridge network
networks:
  default:
    name: monitor-network
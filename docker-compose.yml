version: '3.8'

services:
  flask-monitor:
    build: .
    container_name: monitor_container
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # Database persistence
      - ./monitor.db:/app/monitor.db
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1

# Use default bridge network
networks:
  default:
    name: monitor-network